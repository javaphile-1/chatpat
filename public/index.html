<style>

body {

<body>

<!-- LOGIN -->
<div id="loginScreen">

  <h2>Enter</h2>

  <input
    id="codeInput"
    type="password"
    placeholder="Input code"
    autocomplete="off"
  >

  <br><br>

  <button id="loginBtn">Enter</button>

</div>


<!-- CHAT -->
<div id="chat">

  <div id="header">
    <span id="username"></span>
    <span id="status"></span>
  </div>


  <div id="callBar">

    <button onclick="startCall('audio')">
      📞 Voice
    </button>

    <button onclick="startCall('video')">
      🎥 Video
    </button>

    <!-- RESET JSONBIN BUTTON -->
    <button
      id="resetJsonBinBtn"
      onclick="resetJsonBin()">
      🔄 Reset JSONBin
    </button>

  </div>


  <div id="messages"></div>


  <div
    id="typingIndicator"
    style="
      padding-left:10px;
      font-size:12px;
      color:gray;
      height:20px;">
  </div>


  <div id="inputArea">

    <input
      id="messageInput"
      placeholder="Type message"
    >

    <button onclick="startVoiceTyping()">
      🎤
    </button>

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

</div>


<!-- INCOMING CALL -->
<div id="incomingCall">

  <p id="callerText"></p>

  <button onclick="acceptCall()">
    Accept
  </button>

  <button onclick="rejectCall()">
    Reject
  </button>

</div>


<!-- VIDEO -->
<div id="videoScreen">

  <video
    id="remoteVideo"
    autoplay
    playsinline>
  </video>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline>
  </video>


  <div id="callControls">

    <button
      class="controlBtn"
      onclick="toggleMute()">
      🔇
    </button>

    <button
      class="controlBtn"
      onclick="toggleCamera()">
      🎥
    </button>

    <button
      class="endBtn"
      onclick="endCall()">
      🔴
    </button>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

const SECRET_CODES = {
  "2213": "User 1",
  "1323": "User 2"
};

let socket;
let username;
let peer, localStream;
let callType;
let incomingOffer;
let currentUser = null;
let otherUser = null;

let remoteStream = new MediaStream();


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const code =
    document.getElementById("codeInput")
      .value
      .trim();


  if(code === "2213"){

    username = "User 1";

  }
  else if(code === "1323"){

    username = "User 2";

  }
  else{

    return;

  }


  socket = io();


  document.getElementById("loginScreen")
    .style.display = "none";


  document.getElementById("chat")
    .style.display = "flex";


  document.getElementById("username")
    .innerText = username;


  /*
    Register listeners FIRST.
  */

  initSocketEvents();


  /*
    Then join.
  */

  socket.emit(
    "user joined",
    username
  );
}


/* =========================================================
   SOCKET EVENTS
========================================================= */

function initSocketEvents(){


  /* =======================================================
     TYPING
  ======================================================= */

  socket.on("typing", (user) => {

    document.getElementById(
      "typingIndicator"
    ).innerText =
      user + " is typing...";


    clearTimeout(
      window.typingTimer
    );


    window.typingTimer =
      setTimeout(() => {

        document.getElementById(
          "typingIndicator"
        ).innerText = "";

      }, 1500);

  });


  /* =======================================================
     CHAT HISTORY
  ======================================================= */

  socket.on("chat history", (msgs) => {

    document.getElementById(
      "messages"
    ).innerHTML = "";


    msgs.forEach(
      msg => addMessage(msg)
    );

  });


  /* =======================================================
     CHAT MESSAGE
  ======================================================= */

  socket.on(
    "chat message",
    msg => {

      addMessage(msg);

      socket.emit(
        "message seen",
        msg.id
      );

    }
  );


  /* =======================================================
     MESSAGE SEEN
  ======================================================= */

  socket.on(
    "message seen",
    id => {

      let el =
        document.getElementById(
          "tick-" + id
        );


      if(el) {

        el.innerText = "✔✔";

      }

    }
  );


  /* =======================================================
     ONLINE USERS
  ======================================================= */

  socket.on(
    "online users",
    users => {

      otherUser =
        users.find(
          u => u !== username
        );


      document.getElementById(
        "status"
      ).innerText =
        otherUser
          ? otherUser + " ● Online"
          : "Offline";

    }
  );


  /* =======================================================
     INCOMING CALL
  ======================================================= */

  socket.on(
    "incoming-call",
    data => {

      currentUser = data.from;

      callType = data.type;

      incomingOffer = data.offer;


      document.getElementById(
        "callerText"
      ).innerText =
        data.from + " calling";


      document.getElementById(
        "incomingCall"
      ).style.display = "block";

    }
  );


  /* =======================================================
     CALL ANSWERED
  ======================================================= */

  socket.on(
    "call-answered",
    async answer => {

      if(!peer){

        console.error(
          "Peer not ready"
        );

        return;

      }


      await peer.setRemoteDescription(
        new RTCSessionDescription(answer)
      );

    }
  );


  /* =======================================================
     CALL REJECTED
  ======================================================= */

  socket.on(
    "call-rejected",
    () => {

      alert(
        "Call rejected"
      );

    }
  );


  /* =======================================================
     CALL ENDED
  ======================================================= */

  socket.on(
    "call-ended",
    () => {

      endCall();

    }
  );


  /* =======================================================
     ICE CANDIDATE
  ======================================================= */

  socket.on(
    "ice-candidate",
    async candidate => {

      if(!peer) return;


      try {

        await peer.addIceCandidate(
          candidate
        );

      } catch(err) {

        console.error(
          "ICE Candidate Error:",
          err
        );

      }

    }
  );


  /* =======================================================
     HISTORY CLEARED
  ======================================================= */

  socket.on(
    "history cleared",
    () => {

      document.getElementById(
        "messages"
      ).innerHTML = "";


      const button =
        document.getElementById(
          "resetJsonBinBtn"
        );


      if(button){

        button.disabled = false;

        button.innerText =
          "🔄 Reset JSONBin";

      }


      alert(
        "✅ JSONBin reset successfully.\n\n" +
        "Chat history is now empty."
      );

    }
  );


  /* =======================================================
     HISTORY CLEAR FAILED
  ======================================================= */

  socket.on(
    "history clear failed",
    data => {

      const button =
        document.getElementById(
          "resetJsonBinBtn"
        );


      if(button){

        button.disabled = false;

        button.innerText =
          "🔄 Reset JSONBin";

      }


      alert(
        "❌ JSONBin reset failed.\n\n" +
        (
          data?.message ||
          "Existing history was preserved."
        )
      );

    }
  );

}


/* =========================================================
   CHAT
========================================================= */

function sendMessage(){

  let text =
    messageInput.value.trim();


  if(!text) return;


  socket.emit(
    "chat message",
    {
      user: username,
      text
    }
  );


  messageInput.value = "";

}


/* =========================================================
   TYPING
========================================================= */

messageInput.addEventListener(
  "input",
  () => {

    if(socket){

      socket.emit(
        "typing",
        username
      );

    }

  }
);


messageInput.addEventListener(
  "keypress",
  e => {

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(msg){

  let div =
    document.createElement("div");


  div.style.padding = "10px";

  div.style.margin = "5px";

  div.style.borderRadius = "10px";

  div.style.maxWidth = "70%";


  if(msg.user === username){

    div.style.background =
      "#dcf8c6";

    div.style.marginLeft =
      "auto";

  }
  else {

    div.style.background =
      "white";

  }


  let time =
    new Date(
      msg.time
    ).toLocaleString();


  div.innerHTML = `
    ${msg.text}

    <div
      style="
        font-size:12px;
        color:gray;
        text-align:right;">
      ${time}
      <span id="tick-${msg.id}">
        ${msg.user === username ? "✔" : ""}
      </span>
    </div>
  `;


  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================================
   RESET JSONBIN
========================================================= */

function resetJsonBin(){

  if(!socket){

    alert(
      "❌ Not connected to server."
    );

    return;

  }


  const confirmed =
    confirm(
      "⚠️ RESET JSONBIN?\n\n" +
      "This will permanently delete ALL chat messages.\n\n" +
      "JSONBin will be reset to an empty array [].\n\n" +
      "Continue?"
    );


  if(!confirmed) return;


  const button =
    document.getElementById(
      "resetJsonBinBtn"
    );


  button.disabled = true;

  button.innerText =
    "⏳ Resetting...";


  /*
    Server will clear JSONBin.

    The browser is NOT cleared here.

    It will only be cleared after the server confirms
    that JSONBin was successfully reset.
  */

  socket.emit(
    "clear history"
  );

}


/* =========================================================
   CALL
========================================================= */

async function startCall(type){

  if(!otherUser){

    alert(
      "Other user not online"
    );

    return;

  }


  currentUser =
    otherUser;

  callType =
    type;


  if(type === "video"){

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true,
          audio: true
        });

  }
  else {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          video: false,
          audio: true
        });

  }


  remoteStream =
    new MediaStream();


  await createPeer();


  localStream
    .getTracks()
    .forEach(
      t => peer.addTrack(
        t,
        localStream
      )
    );


  let offer =
    await peer.createOffer();


  await peer.setLocalDescription(
    offer
  );


  socket.emit(
    "call-user",
    {
      to: currentUser,
      offer,
      type
    }
  );


  showVideo();

}


/* =========================================================
   ACCEPT CALL
========================================================= */

async function acceptCall(){

  console.log(
    "1. acceptCall triggered"
  );


  document.getElementById(
    "incomingCall"
  ).style.display = "none";


  try {

    if(callType === "video"){

      localStream =
        await navigator.mediaDevices
          .getUserMedia({
            video: true,
            audio: true
          });

    }
    else {

      localStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

    }


    console.log(
      "2. got media"
    );


    remoteStream =
      new MediaStream();


    await createPeer();


    console.log(
      "3. peer created"
    );


    localStream
      .getTracks()
      .forEach(
        t => peer.addTrack(
          t,
          localStream
        )
      );


    await peer.setRemoteDescription(
      new RTCSessionDescription(
        incomingOffer
      )
    );


    let answer =
      await peer.createAnswer();


    await peer.setLocalDescription(
      answer
    );


    socket.emit(
      "call-accepted",
      {
        to: currentUser,
        answer: answer
      }
    );


    console.log(
      "4. answer sent"
    );


    showVideo();


  } catch(err) {

    console.error(
      "ACCEPT CALL ERROR:",
      err
    );

  }

}


/* =========================================================
   REJECT CALL
========================================================= */

function rejectCall(){

  document.getElementById(
    "incomingCall"
  ).style.display = "none";


  socket.emit(
    "call-rejected",
    {
      to: currentUser
    }
  );

}


/* =========================================================
   CREATE PEER
========================================================= */

async function createPeer(){

  let iceServers;


  try {

    const response =
      await fetch(
        "https://connectlife.metered.live/api/v1/turn/credentials?apiKey=42668cff375214a62aa7ea140cbfe473d807"
      );


    iceServers =
      await response.json();


    console.log(
      "✅ ICE servers loaded:",
      iceServers
    );


  } catch(err) {

    console.error(
      "Failed to fetch ICE servers, using fallback:",
      err
    );


    iceServers = [

      {
        urls:
          "stun:stun.relay.metered.ca:80"
      },

      {
        urls:
          "turn:global.relay.metered.ca:80",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"
      },

      {
        urls:
          "turn:global.relay.metered.ca:80?transport=tcp",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"
      },

      {
        urls:
          "turn:global.relay.metered.ca:443",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"
      },

      {
        urls:
          "turns:global.relay.metered.ca:443?transport=tcp",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"
      }

    ];

  }


  peer =
    new RTCPeerConnection({
      iceTransportPolicy: "all",
      iceServers: iceServers
    });


  setInterval(
    async () => {

      if(!peer) return;


      const stats =
        await peer.getStats();


      stats.forEach(
        report => {

          if(
            report.type ===
              "candidate-pair" &&
            report.state ===
              "succeeded"
          ){

            console.log(
              "Candidate Pair Type:",
              report.localCandidateId,
              report.remoteCandidateId
            );

          }

        }
      );

    },
    5000
  );


  peer.onicecandidate =
    event => {

      if(event.candidate){

        console.log(
          "ICE Candidate:",
          event.candidate.candidate
        );


        const candidate =
          event.candidate.candidate;


        if(candidate.includes("relay")){

          console.log(
            "✅ TURN Candidate Generated"
          );

        }


        if(candidate.includes("srflx")){

          console.log(
            "✅ STUN Candidate Generated"
          );

        }


        if(candidate.includes("host")){

          console.log(
            "✅ Local Candidate Generated"
          );

        }


        socket.emit(
          "ice-candidate",
          {
            to: currentUser,
            candidate: event.candidate
          }
        );

      }

    };


  peer.ontrack =
    event => {

      console.log(
        "Remote Track Received:",
        event.track.kind
      );


      remoteStream.addTrack(
        event.track
      );


      remoteVideo.srcObject =
        remoteStream;


      remoteVideo.muted =
        false;


      remoteVideo.play()
        .catch(
          function(err){

            console.log(
              "Autoplay blocked, trying again:",
              err
            );

          }
        );

    };


  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE State:",
        peer.iceConnectionState
      );

    };


  peer.onconnectionstatechange =
    () => {

      console.log(
        "Connection State:",
        peer.connectionState
      );

    };


  peer.onsignalingstatechange =
    () => {

      console.log(
        "Signaling State:",
        peer.signalingState
      );

    };

}


/* =========================================================
   SHOW VIDEO
========================================================= */

function showVideo(){

  videoScreen.style.display =
    "block";


  remoteVideo.muted =
    false;

  remoteVideo.volume =
    1.0;


  if(localStream){

    localVideo.srcObject =
      localStream;

  }

}


/* =========================================================
   END CALL
========================================================= */

function endCall(){

  if(socket && currentUser){

    socket.emit(
      "call-ended",
      {
        to: currentUser
      }
    );

  }


  if(peer){

    peer.close();

    peer = null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        t => t.stop()
      );

    localStream = null;

  }


  remoteVideo.srcObject =
    null;

  localVideo.srcObject =
    null;


  videoScreen.style.display =
    "none";

  chat.style.display =
    "flex";

}


/* =========================================================
   LOGIN BUTTON
========================================================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    login
  );


/* =========================================================
   MUTE
========================================================= */

function toggleMute(){

  if(!localStream) return;


  var audioTrack =
    localStream.getAudioTracks()[0];


  if(audioTrack){

    audioTrack.enabled =
      !audioTrack.enabled;


    document
      .querySelector(
        '.controlBtn[onclick="toggleMute()"]'
      )
      .innerText =
        audioTrack.enabled
          ? "🔇"
          : "🔈";


    console.log(
      "Mic:",
      audioTrack.enabled
        ? "ON"
        : "OFF"
    );

  }

}


/* =========================================================
   CAMERA
========================================================= */

function toggleCamera(){

  if(!localStream) return;


  var videoTrack =
    localStream.getVideoTracks()[0];


  if(videoTrack){

    videoTrack.enabled =
      !videoTrack.enabled;


    document
      .querySelector(
        '.controlBtn[onclick="toggleCamera()"]'
      )
      .innerText =
        videoTrack.enabled
          ? "🎥"
          : "📷";


    console.log(
      "Camera:",
      videoTrack.enabled
        ? "ON"
        : "OFF"
    );

  }

}


/* =========================================================
   VOICE TYPING
========================================================= */

function startVoiceTyping(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice typing is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  /*
    Keep your original Marathi setting.
  */

  recognition.lang =
    "mr-IN";


  recognition.interimResults =
    true;

  recognition.continuous =
    false;


  recognition.onstart =
    () => {

      console.log(
        "🎤 Listening..."
      );

    };


  recognition.onresult =
    event => {

      let transcript = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        transcript +=
          event.results[i][0].transcript;

      }


      document
        .getElementById(
          "messageInput"
        )
        .value =
        transcript;

    };


  recognition.onerror =
    event => {

      console.error(
        "Voice typing error:",
        event.error
      );

    };


  recognition.onend =
    () => {

      console.log(
        "🎤 Voice typing finished"
      );

    };


  recognition.start();

}

</script>
