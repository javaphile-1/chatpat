<!DOCTYPE html>
<html>
<head>
<title>Private Chat</title>

<style>

body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#ece5dd;
}

#loginScreen {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
}

#chat {
  display:none;
  flex-direction:column;
  height:100vh;
}

@media (min-width: 768px) {
  #chat {
    max-width:600px;
    margin:auto;
    border:1px solid #ccc;
    height:95vh;
  }
}

#header {
  background:#075e54;
  color:white;
  padding:16px;
  font-size:18px;
  display:flex;
  justify-content:space-between;
}

#callBar {
  display:flex;
  gap:10px;
  padding:10px;
}

button {
  border:none;
  border-radius:20px;
  background:#25d366;
  color:white;
  cursor:pointer;
  font-size:18px;
  padding:12px 16px;
}

@media (min-width:768px){
  button {
    font-size:14px;
    padding:8px 12px;
  }
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

#inputArea {
  display:flex;
  padding:10px;
  background:white;
}

#messageInput {
  flex:1;
  border-radius:20px;
  border:1px solid #ccc;
  padding:14px;
  font-size:18px;
}

@media (min-width:768px){
  #messageInput {
    padding:10px;
    font-size:14px;
  }
}

#videoScreen {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:100;
}

#remoteVideo {
  width:100%;
  height:100%;
  object-fit:cover;
}

#localVideo {
  position:absolute;
  bottom:100px;
  right:10px;
  border:2px solid white;
  width:140px;
  height:180px;
}

@media (min-width:768px){
  #localVideo {
    width:180px;
    height:220px;
  }
}

#incomingCall {
  display:none;
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  z-index:200;
  width:80%;
  font-size:18px;
}

@media (min-width:768px){
  #incomingCall {
    width:300px;
    font-size:14px;
  }
}

#callControls {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

.controlBtn {
  background:rgba(255,255,255,0.2);
  border:none;
  border-radius:50%;
  padding:15px;
  font-size:20px;
  color:white;
}

.endBtn {
  background:red;
  border:none;
  border-radius:50%;
  padding:18px;
  font-size:22px;
  color:white;
}

</style>

</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h2>Enter</h2>
  <input id="codeInput" type="password" placeholder="Input code" autocomplete="off">
  <br><br>
  <button id="loginBtn">Enter</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header">
    <span id="username"></span>
    <span id="status"></span>
  </div>
  <div id="callBar">
    <button onclick="startCall('audio')">📞 Voice</button>
    <button onclick="startCall('video')">🎥 Video</button>
  </div>
  <div id="messages"></div>
  <div id="inputArea">
    <input id="messageInput" placeholder="Type message">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- INCOMING CALL -->
<div id="incomingCall">
  <p id="callerText"></p>
  <button onclick="acceptCall()">Accept</button>
  <button onclick="rejectCall()">Reject</button>
</div>

<!-- VIDEO -->
<div id="videoScreen">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>
  <div id="callControls">
    <button class="controlBtn" onclick="toggleMute()">🔇</button>
    <button class="controlBtn" onclick="toggleCamera()">🎥</button>
    <button class="endBtn" onclick="endCall()">🔴</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

let socket;
let username;
let peer, localStream;
let callType;
let incomingOffer;
let currentUser = null;
let otherUser = null;
let remoteStream = new MediaStream();
let pendingCandidates = [];

/* LOGIN */
function login(){
  const code = document.getElementById("codeInput").value.trim();

  if(code === "2213"){
    username = "Tumaji";
  } else if(code === "1323"){
    username = "Rani";
  } else {
    return;
  }

  socket = io();

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  document.getElementById("username").innerText = username;

  initSocketEvents();
  socket.emit("user joined", username);
}

/* SOCKET EVENTS */
function initSocketEvents(){

  socket.on("chat message", msg=>{
    addMessage(msg);
    socket.emit("message seen", msg.id);
  });

  socket.on("message seen", id=>{
    let el = document.getElementById("tick-"+id);
    if(el) el.innerText = "✔✔";
  });

  socket.on("online users", users=>{
    otherUser = users.find(u => u !== username);
    document.getElementById("status").innerText =
      otherUser ? otherUser + " ● Online" : "Offline";
  });

  socket.on("incoming-call", data=>{
    currentUser = data.from;
    callType = data.type;
    incomingOffer = data.offer;
    document.getElementById("callerText").innerText = data.from + " calling";
    document.getElementById("incomingCall").style.display = "block";
  });

  socket.on("call-answered", async answer=>{
    await peer.setRemoteDescription(new RTCSessionDescription(answer));
    await flushCandidates();
  });

  socket.on("call-rejected", ()=>{
    alert("Call rejected");
  });

  socket.on("call-ended", ()=>{
    endCall();
  });

  socket.on("ice-candidate", async candidate=>{
    if(peer && peer.remoteDescription){
      await peer.addIceCandidate(candidate);
    } else {
      pendingCandidates.push(candidate);
      console.log("⏳ Buffered ICE candidate");
    }
  });
}

/* FLUSH BUFFERED ICE CANDIDATES */
async function flushCandidates(){
  for(const candidate of pendingCandidates){
    await peer.addIceCandidate(candidate);
    console.log("✅ Added buffered ICE candidate");
  }
  pendingCandidates = [];
}

/* CHAT */
function sendMessage(){
  let text = messageInput.value.trim();
  if(!text) return;
  socket.emit("chat message", {user: username, text});
  messageInput.value = "";
}

messageInput.addEventListener("keypress", e=>{
  if(e.key === "Enter") sendMessage();
});

function addMessage(msg){
  let div = document.createElement("div");
  div.style.padding = "10px";
  div.style.margin = "5px";
  div.style.borderRadius = "10px";
  div.style.maxWidth = "70%";

  if(msg.user === username){
    div.style.background = "#dcf8c6";
    div.style.marginLeft = "auto";
  } else {
    div.style.background = "white";
  }

  let time = new Date(msg.time).toLocaleString();

  div.innerHTML = `
    ${msg.text}
    <div style="font-size:12px;color:gray;text-align:right;">
      ${time} <span id="tick-${msg.id}">${msg.user === username ? "✔" : ""}</span>
    </div>
  `;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* CALL */
async function startCall(type){
  if(!otherUser){
    alert("Other user not online");
    return;
  }

  currentUser = otherUser;
  callType = type;

  if(type === 'video'){
    localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
  } else {
    localStream = await navigator.mediaDevices.getUserMedia({video: false, audio: true});
  }

  remoteStream = new MediaStream();
  pendingCandidates = [];

  await createPeer();

  localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

  let offer = await peer.createOffer();
  await peer.setLocalDescription(offer);

  socket.emit("call-user", {to: currentUser, offer, type});

  showVideo();
}

async function acceptCall(){
  console.log("1. acceptCall triggered");

  document.getElementById("incomingCall").style.display = "none";

  try {
    if(callType === "video"){
      localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
    } else {
      localStream = await navigator.mediaDevices.getUserMedia({audio: true});
    }

    console.log("2. got media");

    remoteStream = new MediaStream();
    pendingCandidates = [];

    await createPeer();

    console.log("3. peer created");

    localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

    await peer.setRemoteDescription(new RTCSessionDescription(incomingOffer));

    await flushCandidates();

    let answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);

    socket.emit("call-accepted", {to: currentUser, answer: answer});

    console.log("4. answer sent");

    showVideo();

  } catch(err){
    console.error("ACCEPT CALL ERROR:", err);
  }
}

function rejectCall(){
  document.getElementById("incomingCall").style.display = "none";
  socket.emit("call-rejected", {to: currentUser});
}

async function createPeer(){

  let iceServers;
  try {
    const response = await fetch('https://connectlife.metered.live/api/v1/turn/credentials?apiKey=7d5869857d8a714570bd2a85a5c58a9c8d2e');
    iceServers = await response.json();
    console.log("✅ ICE servers fetched:", iceServers);
  } catch(err){
    console.error("Failed to fetch ICE servers, using fallback:", err);
    iceServers = [
      {urls: "stun:stun.l.google.com:19302"},
      {urls: "stun:stun1.l.google.com:19302"}
    ];
  }

  peer = new RTCPeerConnection({
    iceTransportPolicy: "all",
    iceServers: iceServers
  });

  peer.onicecandidate = (event) => {
    if(event.candidate){
      console.log("ICE candidate type:", event.candidate.type);
      socket.emit("ice-candidate", {to: currentUser, candidate: event.candidate});
    } else {
      console.log("All ICE candidates gathered");
    }
  };

  peer.ontrack = (event) => {
    console.log("Got remote track:", event.track.kind);
    if(event.streams && event.streams[0]){
      remoteVideo.srcObject = event.streams[0];
    } else {
      remoteStream.addTrack(event.track);
      remoteVideo.srcObject = remoteStream;
    }
    remoteVideo.muted = false;
    remoteVideo.volume = 1.0;
    remoteVideo.play().catch(err => console.log('Autoplay blocked:', err));
  };

  peer.oniceconnectionstatechange = () => {
    console.log("ICE state:", peer.iceConnectionState);
  };

  peer.onconnectionstatechange = () => {
    console.log("Connection state:", peer.connectionState);
  };
}

function showVideo(){
  videoScreen.style.display = "block";
  remoteVideo.muted = false;
  remoteVideo.volume = 1.0;
  if(localStream){
    localVideo.srcObject = localStream;
  }
}

function endCall(){
  if(socket && currentUser){
    socket.emit("call-ended", {to: currentUser});
  }
  if(peer){
    peer.close();
    peer = null;
  }
  if(localStream){
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  videoScreen.style.display = "none";
  chat.style.display = "flex";
}

function toggleMute(){
  if(!localStream) return;
  var audioTrack = localStream.getAudioTracks()[0];
  if(audioTrack){
    audioTrack.enabled = !audioTrack.enabled;
    document.querySelector('.controlBtn[onclick="toggleMute()"]').innerText =
      audioTrack.enabled ? '🔇' : '🔈';
    console.log('Mic:', audioTrack.enabled ? 'ON' : 'OFF');
  }
}

function toggleCamera(){
  if(!localStream) return;
  var videoTrack = localStream.getVideoTracks()[0];
  if(videoTrack){
    videoTrack.enabled = !videoTrack.enabled;
    document.querySelector('.controlBtn[onclick="toggleCamera()"]').innerText =
      videoTrack.enabled ? '🎥' : '📷';
    console.log('Camera:', videoTrack.enabled ? 'ON' : 'OFF');
  }
}

document.getElementById("loginBtn").addEventListener("click", login);

</script>

</body>
</html>
