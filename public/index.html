<!DOCTYPE html>
<html>

<head>

<title>Private Chat</title>

<style>

/* =========================================================
   RESET
========================================================= */

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #ece5dd;

}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen {

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  height: 100vh;

}


/* =========================================================
   CHAT CONTAINER
========================================================= */

#chat {

  display: none;

  flex-direction: column;

  height: 100vh;

}


/* =========================================================
   DESKTOP CENTER LAYOUT
========================================================= */

@media (min-width: 768px) {

  #chat {

    max-width: 600px;

    margin: auto;

    border: 1px solid #ccc;

    height: 95vh;

  }

}


/* =========================================================
   HEADER
========================================================= */

#header {

  background: #075e54;

  color: white;

  padding: 16px;

  font-size: 18px;

  display: flex;

  justify-content: space-between;

}


/* =========================================================
   CALL BAR
========================================================= */

#callBar {

  display: flex;

  gap: 10px;

  padding: 10px;

  flex-wrap: wrap;

}


/* =========================================================
   BUTTON
========================================================= */

button {

  border: none;

  border-radius: 20px;

  background: #25d366;

  color: white;

  cursor: pointer;

}


/* =========================================================
   DISABLED BUTTON
========================================================= */

button:disabled {

  opacity: 0.6;

  cursor: not-allowed;

}


/* =========================================================
   MOBILE BUTTON SIZE
========================================================= */

button {

  font-size: 18px;

  padding: 12px 16px;

}


/* =========================================================
   DESKTOP BUTTON SIZE
========================================================= */

@media (min-width: 768px) {

  button {

    font-size: 14px;

    padding: 8px 12px;

  }

}


/* =========================================================
   CLEAR CHAT BUTTON
========================================================= */

#resetJsonBinBtn {

  background: #d32f2f;

}


/* =========================================================
   MESSAGES
========================================================= */

#messages {

  flex: 1;

  overflow-y: auto;

  padding: 10px;

}


/* =========================================================
   INPUT AREA
========================================================= */

#inputArea {

  display: flex;

  padding: 10px;

  background: white;

}


#messageInput {

  flex: 1;

  border-radius: 20px;

  border: 1px solid #ccc;

}


/* =========================================================
   MOBILE INPUT
========================================================= */

#messageInput {

  padding: 14px;

  font-size: 18px;

}


/* =========================================================
   DESKTOP INPUT
========================================================= */

@media (min-width: 768px) {

  #messageInput {

    padding: 10px;

    font-size: 14px;

  }

}


/* =========================================================
   VIDEO FULLSCREEN
========================================================= */

#videoScreen {

  display: none;

  position: fixed;

  top: 0;

  left: 0;

  width: 100%;

  height: 100%;

  background: black;

  z-index: 100;

}


/* =========================================================
   REMOTE VIDEO
========================================================= */

#remoteVideo {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


/* =========================================================
   LOCAL VIDEO
========================================================= */

#localVideo {

  position: absolute;

  bottom: 100px;

  right: 10px;

  border: 2px solid white;

}


/* =========================================================
   MOBILE VIDEO SIZE
========================================================= */

#localVideo {

  width: 140px;

  height: 180px;

}


/* =========================================================
   DESKTOP VIDEO SIZE
========================================================= */

@media (min-width: 768px) {

  #localVideo {

    width: 180px;

    height: 220px;

  }

}


/* =========================================================
   INCOMING CALL POPUP
========================================================= */

#incomingCall {

  display: none;

  position: fixed;

  top: 40%;

  left: 50%;

  transform: translate(-50%, -50%);

  background: white;

  padding: 20px;

  border-radius: 10px;

  text-align: center;

  z-index: 200;

}


/* =========================================================
   MOBILE POPUP
========================================================= */

#incomingCall {

  width: 80%;

  font-size: 18px;

}


/* =========================================================
   DESKTOP POPUP
========================================================= */

@media (min-width: 768px) {

  #incomingCall {

    width: 300px;

    font-size: 14px;

  }

}


/* =========================================================
   CALL CONTROLS
========================================================= */

#callControls {

  position: absolute;

  bottom: 20px;

  width: 100%;

  display: flex;

  justify-content: center;

  gap: 20px;

}


/* =========================================================
   CONTROL BUTTON
========================================================= */

.controlBtn {

  background: rgba(255,255,255,0.2);

  border: none;

  border-radius: 50%;

  padding: 15px;

  font-size: 20px;

  color: white;

}


/* =========================================================
   END CALL BUTTON
========================================================= */

.endBtn {

  background: red;

  border: none;

  border-radius: 50%;

  padding: 18px;

  font-size: 22px;

  color: white;

}

</style>

</head>


<body>


<!-- =======================================================
     LOGIN
======================================================== -->

<div id="loginScreen">

  <h2>Enter</h2>


  <input
    id="codeInput"
    type="password"
    placeholder="Input code"
    autocomplete="off"
  >


  <br>

  <br>


  <button id="loginBtn">
    Enter
  </button>

</div>



<!-- =======================================================
     CHAT
======================================================== -->

<div id="chat">


  <!-- HEADER -->

  <div id="header">

    <span id="username"></span>

    <span id="status"></span>

  </div>



  <!-- CALL BAR -->

  <div id="callBar">


    <button onclick="startCall('audio')">

      📞 Voice

    </button>


    <button onclick="startCall('video')">

      🎥 Video

    </button>


    <!-- CLEAR CHAT -->

    <button
      id="clearChatBtn"
      onclick="clearChat()"
      style="background:#d32f2f;"
    >

      🗑️ Clear

    </button>


  </div>



  <!-- MESSAGES -->

  <div id="messages"></div>



  <!-- TYPING -->

  <div
    id="typingIndicator"
    style="
      padding-left:10px;
      font-size:12px;
      color:gray;
      height:20px;"
  >

  </div>



  <!-- INPUT -->

  <div id="inputArea">


    <input
      id="messageInput"
      placeholder="Type message"
    >


    <button
      onclick="startVoiceTyping()"
    >

      🎤

    </button>


    <button
      onclick="sendMessage()"
    >

      Send

    </button>


  </div>


</div>



<!-- =======================================================
     INCOMING CALL
======================================================== -->

<div id="incomingCall">


  <p id="callerText"></p>


  <button onclick="acceptCall()">

    Accept

  </button>


  <button onclick="rejectCall()">

    Reject

  </button>


</div>



<!-- =======================================================
     VIDEO
======================================================== -->

<div id="videoScreen">


  <video
    id="remoteVideo"
    autoplay
    playsinline
  >
  </video>


  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  >
  </video>


  <div id="callControls">


    <button
      class="controlBtn"
      onclick="toggleMute()"
    >

      🔇

    </button>


    <button
      class="controlBtn"
      onclick="toggleCamera()"
    >

      🎥

    </button>


    <button
      class="endBtn"
      onclick="endCall()"
    >

      🔴

    </button>


  </div>

</div>



<!-- =======================================================
     SOCKET.IO
======================================================== -->

<script src="/socket.io/socket.io.js"></script>


<script>

/* =========================================================
   LOGIN CODES
========================================================= */

const SECRET_CODES = {

  "2213": "User 1",

  "1323": "User 2"

};


let socket;

let username;

let peer;

let localStream;

let callType;

let incomingOffer;

let currentUser = null;

let otherUser = null;

let remoteStream =
  new MediaStream();


/* =========================================================
   LOGIN
========================================================= */

function login() {


  const code =
    document
      .getElementById("codeInput")
      .value
      .trim();


  if (code === "2213") {

    username = "User 1";

  }

  else if (code === "1323") {

    username = "User 2";

  }

  else {

    alert("Invalid code.");

    return;

  }


  socket = io();


  document
    .getElementById("loginScreen")
    .style.display = "none";


  document
    .getElementById("chat")
    .style.display = "flex";


  document
    .getElementById("username")
    .innerText = username;


  /*
    Register listeners BEFORE joining.
  */

  initSocketEvents();


  /*
    Join server.
  */

  socket.emit(
    "user joined",
    username
  );

}


/* =========================================================
   SOCKET EVENTS
========================================================= */

function initSocketEvents() {


  /* =======================================================
     TYPING
  ======================================================= */

  socket.on(
    "typing",
    (user) => {


      document
        .getElementById(
          "typingIndicator"
        )
        .innerText =
          user + " is typing...";


      clearTimeout(
        window.typingTimer
      );


      window.typingTimer =
        setTimeout(
          () => {

            document
              .getElementById(
                "typingIndicator"
              )
              .innerText = "";

          },
          1500
        );

    }
  );


  /* =======================================================
     CHAT HISTORY
  ======================================================= */

  socket.on(
    "chat history",
    (msgs) => {


      const messages =
        document.getElementById(
          "messages"
        );


      messages.innerHTML = "";


      msgs.forEach(
        msg => addMessage(msg)
      );

    }
  );


  /* =======================================================
     CHAT MESSAGE
  ======================================================= */

  socket.on(
    "chat message",
    (msg) => {


      addMessage(msg);


      socket.emit(
        "message seen",
        msg.id
      );

    }
  );


  /* =======================================================
     MESSAGE SAVE FAILED
  ======================================================= */

  socket.on(
    "message save failed",
    () => {

      alert(
        "❌ Message could not be saved."
      );

    }
  );

   /* =======================================================
   USER JOINED
======================================================= */

socket.on("user joined", (username) => {

  console.log("🔵 USER JOINED:", username, socket.id);

  socket.username = username;

  // If this user already has another socket,
  // replace it with the newest connection.
  users[username] = socket.id;

  // Send chat history
  socket.emit("chat history", messageHistory);

  // Update everyone
  io.emit("online users", Object.keys(users));

  console.log("🟢 ONLINE USERS:", Object.keys(users));

  // Email notification
  sendOnlineNotification(username);
});


/* =======================================================
   DISCONNECT
======================================================= */

socket.on("disconnect", (reason) => {

  console.log(
    "🔴 SOCKET DISCONNECTED:",
    socket.username,
    socket.id,
    "Reason:",
    reason
  );

  /*
    IMPORTANT:

    Only remove the user if this disconnected socket
    is still the socket stored for that username.

    This prevents an old connection from marking the
    newly reconnected user as offline.
  */

  if (
    socket.username &&
    users[socket.username] === socket.id
  ) {

    delete users[socket.username];

    console.log(
      "🔴 USER OFFLINE:",
      socket.username
    );

  } else {

    console.log(
      "ℹ️ Old socket disconnected; user is still online."
    );

  }

  io.emit(
    "online users",
    Object.keys(users)
  );

  console.log(
    "🟢 CURRENT ONLINE USERS:",
    Object.keys(users)
  );

});


  /* =======================================================
     MESSAGE SEEN
  ======================================================= */

  socket.on(
    "message seen",
    (id) => {


      const el =
        document.getElementById(
          "tick-" + id
        );


      if (el) {

        el.innerText =
          "✔✔";

      }

    }
  );


  /* =======================================================
     ONLINE USERS
  ======================================================= */

  socket.on(
    "online users",
    (users) => {


      otherUser =
        users.find(
          u => u !== username
        );


      document
        .getElementById("status")
        .innerText =
          otherUser
            ? otherUser + " ● Online"
            : "Offline";

    }
  );


  /* =======================================================
     INCOMING CALL
  ======================================================= */

  socket.on(
    "incoming-call",
    (data) => {


      currentUser =
        data.from;


      callType =
        data.type;


      incomingOffer =
        data.offer;


      document
        .getElementById(
          "callerText"
        )
        .innerText =
          data.from + " calling";


      document
        .getElementById(
          "incomingCall"
        )
        .style.display =
          "block";

    }
  );


  /* =======================================================
     CALL ANSWERED
  ======================================================= */

  socket.on(
    "call-answered",
    async (answer) => {


      if (!peer) {

        console.error(
          "Peer not ready"
        );

        return;

      }


      await peer.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );

    }
  );


  /* =======================================================
     CALL REJECTED
  ======================================================= */

  socket.on(
    "call-rejected",
    () => {

      alert(
        "Call rejected"
      );

    }
  );


  /* =======================================================
     CALL ENDED
  ======================================================= */

  socket.on(
    "call-ended",
    () => {

      endCall();

    }
  );


  /* =======================================================
     ICE CANDIDATE
  ======================================================= */

  socket.on(
    "ice-candidate",
    async (candidate) => {


      if (!peer) {

        return;

      }


      try {

        await peer.addIceCandidate(
          candidate
        );

      }

      catch (err) {

        console.error(
          "ICE Candidate Error:",
          err
        );

      }

    }
  );


  /* =======================================================
     HISTORY CLEARED
  ======================================================= */

  socket.on(
    "history cleared",
    () => {


      /*
        IMPORTANT:

        The server has successfully
        deleted the data from Supabase.

        Now clear the browser.
      */

      document
        .getElementById(
          "messages"
        )
        .innerHTML = "";


      alert(
        "✅ All chat history deleted."
      );

    }
  );


  /* =======================================================
     HISTORY CLEAR FAILED
  ======================================================= */

  socket.on(
    "history clear failed",
    (data) => {


      alert(
        "❌ Could not delete chat history.\n\n" +
        (
          data?.message ||
          "Database deletion failed."
        )
      );

    }
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage() {


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  if (!socket) {

    alert(
      "Not connected to server."
    );

    return;

  }


  socket.emit(
    "chat message",
    {

      user:
        username,

      text:
        text

    }
  );


  input.value = "";

}


/* =========================================================
   TYPING
========================================================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "input",
    () => {


      if (socket) {

        socket.emit(
          "typing",
          username
        );

      }

    }
  );


document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keypress",
    (e) => {


      if (e.key === "Enter") {

        sendMessage();

      }

    }
  );


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(msg) {


  const div =
    document.createElement(
      "div"
    );


  div.style.padding =
    "10px";


  div.style.margin =
    "5px";


  div.style.borderRadius =
    "10px";


  div.style.maxWidth =
    "70%";


  if (
    msg.user === username
  ) {


    div.style.background =
      "#dcf8c6";


    div.style.marginLeft =
      "auto";

  }

  else {

    div.style.background =
      "white";

  }


  const time =
    new Date(
      msg.time
    ).toLocaleString();


  /*
    Use textContent instead of
    directly inserting message text
    into innerHTML.

    This prevents HTML injection.
  */

  const messageText =
    document.createElement(
      "div"
    );


  messageText.textContent =
    msg.text;


  div.appendChild(
    messageText
  );


  const info =
    document.createElement(
      "div"
    );


  info.style.fontSize =
    "12px";


  info.style.color =
    "gray";


  info.style.textAlign =
    "right";


  info.innerText =
    time;


  if (
    msg.user === username
  ) {


    const tick =
      document.createElement(
        "span"
      );


    tick.id =
      "tick-" + msg.id;


    tick.innerText =
      "✔";


    info.appendChild(
      tick
    );

  }


  div.appendChild(
    info
  );


  const messages =
    document.getElementById(
      "messages"
    );


  messages.appendChild(
    div
  );


  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat() {


  if (!socket) {

    alert(
      "❌ Not connected to server."
    );

    return;

  }


  const confirmed =
    confirm(
      "⚠️ DELETE ALL CHAT HISTORY?\n\n" +
      "This will permanently delete all messages " +
      "from the database.\n\n" +
      "Continue?"
    );


  if (!confirmed) {

    return;

  }


  const button =
    document.getElementById(
      "clearChatBtn"
    );


  /*
    Disable button while server
    is deleting database records.
  */

  button.disabled =
    true;


  button.innerText =
    "⏳ Clearing...";


  socket.emit(
    "clear history"
  );


  /*
    Re-enable after a short period.

    The actual screen clearing is handled
    by the "history cleared" event.
  */

  setTimeout(
    () => {

      button.disabled =
        false;

      button.innerText =
        "🗑️ Clear";

    },
    2000
  );

}


/* =========================================================
   CALL
========================================================= */

async function startCall(type) {


  if (!otherUser) {

    alert(
      "Other user not online"
    );

    return;

  }


  currentUser =
    otherUser;


  callType =
    type;


  if (type === "video") {

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: true,

          audio: true

        });

  }

  else {

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: false,

          audio: true

        });

  }


  remoteStream =
    new MediaStream();


  await createPeer();


  localStream
    .getTracks()
    .forEach(
      track =>
        peer.addTrack(
          track,
          localStream
        )
    );


  const offer =
    await peer.createOffer();


  await peer.setLocalDescription(
    offer
  );


  socket.emit(
    "call-user",
    {

      to:
        currentUser,

      offer,

      type

    }
  );


  showVideo();

}


/* =========================================================
   ACCEPT CALL
========================================================= */

async function acceptCall() {


  document
    .getElementById(
      "incomingCall"
    )
    .style.display =
      "none";


  try {


    if (
      callType === "video"
    ) {


      localStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video: true,

            audio: true

          });

    }

    else {


      localStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            audio: true

          });

    }


    remoteStream =
      new MediaStream();


    await createPeer();


    localStream
      .getTracks()
      .forEach(
        track =>
          peer.addTrack(
            track,
            localStream
          )
      );


    await peer.setRemoteDescription(
      new RTCSessionDescription(
        incomingOffer
      )
    );


    const answer =
      await peer.createAnswer();


    await peer.setLocalDescription(
      answer
    );


    socket.emit(
      "call-accepted",
      {

        to:
          currentUser,

        answer:
          answer

      }
    );


    showVideo();


  }

  catch (err) {

    console.error(
      "ACCEPT CALL ERROR:",
      err
    );

  }

}


/* =========================================================
   REJECT CALL
========================================================= */

function rejectCall() {


  document
    .getElementById(
      "incomingCall"
    )
    .style.display =
      "none";


  socket.emit(
    "call-rejected",
    {

      to:
        currentUser

    }
  );

}


/* =========================================================
   CREATE PEER
========================================================= */

async function createPeer() {


  let iceServers;


  try {


    const response =
      await fetch(
        "https://connectlife.metered.live/api/v1/turn/credentials?apiKey=42668cff375214a62aa7ea140cbfe473d807"
      );


    iceServers =
      await response.json();


    console.log(
      "✅ ICE servers loaded:",
      iceServers
    );


  }

  catch (err) {


    console.error(
      "Failed to fetch ICE servers, using fallback:",
      err
    );


    iceServers = [

      {
        urls:
          "stun:stun.relay.metered.ca:80"
      },

      {
        urls:
          "turn:global.relay.metered.ca:80",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"

      },

      {
        urls:
          "turn:global.relay.metered.ca:80?transport=tcp",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"

      },

      {
        urls:
          "turn:global.relay.metered.ca:443",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"

      },

      {
        urls:
          "turns:global.relay.metered.ca:443?transport=tcp",

        username:
          "9587c9164611467ffd7b9dbd",

        credential:
          "q3/1+5G7wUDnzmXx"

      }

    ];

  }


  peer =
    new RTCPeerConnection({

      iceTransportPolicy:
        "all",

      iceServers:
        iceServers

    });


  peer.onicecandidate =
    event => {


      if (
        event.candidate
      ) {


        const candidate =
          event.candidate.candidate;


        console.log(
          "ICE Candidate:",
          candidate
        );


        if (
          candidate.includes(
            "relay"
          )
        ) {

          console.log(
            "✅ TURN Candidate Generated"
          );

        }


        if (
          candidate.includes(
            "srflx"
          )
        ) {

          console.log(
            "✅ STUN Candidate Generated"
          );

        }


        if (
          candidate.includes(
            "host"
          )
        ) {

          console.log(
            "✅ Local Candidate Generated"
          );

        }


        socket.emit(
          "ice-candidate",
          {

            to:
              currentUser,

            candidate:
              event.candidate

          }
        );

      }

    };


  peer.ontrack =
    event => {


      console.log(
        "Remote Track Received:",
        event.track.kind
      );


      remoteStream.addTrack(
        event.track
      );


      document
        .getElementById(
          "remoteVideo"
        )
        .srcObject =
          remoteStream;


      const remoteVideo =
        document.getElementById(
          "remoteVideo"
        );


      remoteVideo.muted =
        false;


      remoteVideo.play()
        .catch(
          err => {

            console.log(
              "Autoplay blocked:",
              err
            );

          }
        );

    };


  peer.oniceconnectionstatechange =
    () => {


      console.log(
        "ICE State:",
        peer.iceConnectionState
      );

    };


  peer.onconnectionstatechange =
    () => {


      console.log(
        "Connection State:",
        peer.connectionState
      );

    };


  peer.onsignalingstatechange =
    () => {


      console.log(
        "Signaling State:",
        peer.signalingState
      );

    };

}


/* =========================================================
   SHOW VIDEO
========================================================= */

function showVideo() {


  document
    .getElementById(
      "videoScreen"
    )
    .style.display =
      "block";


  const remoteVideo =
    document.getElementById(
      "remoteVideo"
    );


  remoteVideo.muted =
    false;


  remoteVideo.volume =
    1.0;


  if (localStream) {


    document
      .getElementById(
        "localVideo"
      )
      .srcObject =
        localStream;

  }

}


/* =========================================================
   END CALL
========================================================= */

function endCall() {


  if (
    socket &&
    currentUser
  ) {


    socket.emit(
      "call-ended",
      {

        to:
          currentUser

      }
    );

  }


  if (peer) {


    peer.close();

    peer =
      null;

  }


  if (localStream) {


    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    localStream =
      null;

  }


  document
    .getElementById(
      "remoteVideo"
    )
    .srcObject =
      null;


  document
    .getElementById(
      "localVideo"
    )
    .srcObject =
      null;


  document
    .getElementById(
      "videoScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "chat"
    )
    .style.display =
      "flex";

}


/* =========================================================
   MUTE
========================================================= */

function toggleMute() {


  if (!localStream) {

    return;

  }


  const audioTrack =
    localStream
      .getAudioTracks()[0];


  if (audioTrack) {


    audioTrack.enabled =
      !audioTrack.enabled;


    document
      .querySelector(
        '.controlBtn[onclick="toggleMute()"]'
      )
      .innerText =
        audioTrack.enabled
          ? "🔇"
          : "🔈";


    console.log(
      "Mic:",
      audioTrack.enabled
        ? "ON"
        : "OFF"
    );

  }

}


/* =========================================================

========================================================= */

function toggleCamera() {


  if (!localStream) {

  }


  const videoTrack =

}


/* =========================================================
   VOICE TYPING
========================================================= */

function startVoiceTyping() {


  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {


    alert(
      "Voice typing is not supported in this browser."
    );


    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "mr-IN";


  recognition.interimResults =
    true;


  recognition.continuous =
    false;


  recognition.onstart =
    () => {

      console.log(
        "🎤 Listening..."
      );

    };


  recognition.onresult =
    event => {


      let transcript =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {


        transcript +=
          event.results[i][0]
            .transcript;

      }


      document
        .getElementById(
          "messageInput"
        )
        .value =
          transcript;

    };


  recognition.onerror =
    event => {


      console.error(
        "Voice typing error:",
        event.error
      );

    };


  recognition.onend =
    () => {

      console.log(
        "🎤 Voice typing finished"
      );

    };


  recognition.start();

}
